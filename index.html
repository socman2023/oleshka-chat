<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f8">
  <meta name="color-scheme" content="light">
  <title>Олешка — чат</title>

  <link rel="stylesheet" href="./styles.css">

  <!-- VK Bridge: единственная сохранённая зависимость старой версии. -->
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="chat-header">
      <div class="character-mark" aria-hidden="true">О</div>

      <div class="character-heading">
        <h1>Олешка</h1>
        <p id="connection-status">чат с княжичем из Поднебесья</p>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite" aria-label="Диалог">
      <article class="message message--assistant">
        <div class="message__bubble">
          Ну, привет. Чего хотел?
        </div>
      </article>
    </main>

    <form id="composer" class="composer" autocomplete="off">
      <label class="sr-only" for="message-input">Сообщение Олешке</label>
      <textarea
        id="message-input"
        name="message"
        rows="1"
        maxlength="4000"
        placeholder="Напиши Олешке…"
        enterkeyhint="send"
        required
      ></textarea>

      <button id="send-button" class="send-button" type="submit" aria-label="Отправить сообщение">
        <span aria-hidden="true">↑</span>
      </button>
    </form>
  </div>

  <noscript>
    <p class="noscript">Для работы чата нужен JavaScript.</p>
  </noscript>
</body>
</html>
