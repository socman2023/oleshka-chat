name: Oleshka UI safety checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  safety-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run UI regression tests
        run: node --test tests/error-ui.test.mjs
